apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helloworld-demo-mcp.fullname" . }}
  labels:
    {{- include "helloworld-demo-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "helloworld-demo-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "helloworld-demo-mcp.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "helloworld-demo-mcp.fullname" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: {{ include "helloworld-demo-mcp.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          args:
            - --transport
            - streamable-http
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.service.port | quote }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.healthProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthProbe.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.healthProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.healthProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
