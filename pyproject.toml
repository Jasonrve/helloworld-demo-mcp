[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helloworld-demo-mcp"
version = "0.1.0"
description = "A hello-world MCP server exposed over streamable HTTP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.26,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "anyio>=4",
  "httpx>=0.27",
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[project.scripts]
helloworld-demo-mcp = "helloworld_demo_mcp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: end-to-end HTTP MCP tests",
]
